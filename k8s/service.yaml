# Definición de la API de Kubernetes para Servicios
apiVersion: v1
kind: Service
metadata:
  # Nombre del servicio que se usará para la resolución de DNS interno
  name: apuestas-service
  namespace: default
  labels:
    app: apuestas-service
spec:
  # Mapeo de puertos
  ports:
    - port: 8005
      targetPort: 8005
      name: http
  # Selector para encontrar qué pods pertenecen a este servicio
  selector:
    app: apuestas-service
  # Tipo de servicio: ClusterIP (solo accesible internamente en el clúster)
  type: ClusterIP